# Netlify build for the frontend. The repository holds two projects, so the
# build runs from frontend/. Set NEXT_PUBLIC_API_URL in the site's
# environment variables before the first deploy — it is baked in at build time.
# Netlify detects Next.js and applies its Next.js runtime automatically.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
